name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint FFI
        run: npm run lint

      - name: Build source
        run: npm run-script build

      - name: Run tests
        run: npm test

      - name: Check Formatting
        run: npm run format:check
